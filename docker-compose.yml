version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend-core/Dockerfile
    container_name: gasometria-backend
    ports:
      - "5000:5000"
    environment:
      - FLASK_DEBUG=false
      - PYTHONUNBUFFERED=1
      - HOST=0.0.0.0
      - PORT=5000
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

