version: '3.8'

services:
  # Serviço OCR (Python)
  ocr-service:
    build: ./ocr-service
    container_name: ocr-service
    ports:
      - "5000:5000"
    volumes:
      - ./ocr-service:/app
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - gasometria-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Backend Core (Node.js)
  backend-core:
    build: ./backend-core
    container_name: backend-core
    ports:
      - "3000:3000"
    volumes:
      - ./backend-core:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - PORT=3000
      - OCR_SERVICE_URL=http://ocr-service:5000
    depends_on:
      - ocr-service
    networks:
      - gasometria-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

networks:
  gasometria-network:
    driver: bridge
